<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mulțumim — revenim cu un audit scurt</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --brand-green:#10B981;
      --brand-blue:#38BDF8;
      --bg:#050505;
    }

    *{ box-sizing:border-box; }

    html{
      min-height:100%;
      background:#050505;
    }

    body{
      margin:0;
      min-height:100vh;
      color:white;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(980px 420px at 10% 7%, rgba(16,185,129,.095), transparent 68%),
        radial-gradient(1320px 620px at 88% 84%, rgba(56,189,248,.068), transparent 78%),
        radial-gradient(820px 380px at 55% 48%, rgba(255,255,255,.012), transparent 78%),
        linear-gradient(180deg,#050505 0%,#070707 48%,#050505 100%);
      overflow:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.055;
      background-image:
        linear-gradient(rgba(255,255,255,.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.18) 1px, transparent 1px);
      background-size:38px 38px;
      mask-image:radial-gradient(circle at 50% 44%, black, transparent 73%);
    }

    body::after{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.09;
      background:
        radial-gradient(680px 300px at 54% 52%, rgba(56,189,248,.056), transparent 80%),
        repeating-radial-gradient(circle at 20% 20%, rgba(255,255,255,.16) 0 1px, transparent 1px 5px);
      mix-blend-mode:overlay;
      mask-image:linear-gradient(to bottom, black, transparent 84%);
    }

    .scene{
      position:relative;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px 18px 40px;
      transform:translateY(-10px);
      isolation:isolate;
    }

    .orb{
      position:absolute;
      border-radius:999px;
      filter:blur(78px);
      pointer-events:none;
      z-index:-1;
      transform:translateZ(0);
    }

    .orb-a{
      width:520px;
      height:520px;
      left:calc(50% - 520px);
      top:calc(50% - 330px);
      background:rgba(16,185,129,.075);
    }

    .orb-b{
      width:920px;
      height:540px;
      right:calc(50% - 760px);
      bottom:calc(50% - 380px);
      background:linear-gradient(145deg, rgba(56,189,248,.052), rgba(56,189,248,.018) 46%, rgba(16,185,129,.014));
    }

    .stage-line{
      position:absolute;
      left:9vw;
      right:9vw;
      top:50%;
      height:1px;
      background:linear-gradient(90deg, transparent, rgba(16,185,129,.26), rgba(56,189,248,.24), transparent);
      opacity:.34;
      z-index:-1;
    }

    .stage-line::after{
      content:"";
      position:absolute;
      left:38%;
      top:-1px;
      width:190px;
      height:3px;
      border-radius:999px;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,.38), transparent);
      filter:blur(.5px);
      opacity:.22;
    }

    .card{
      width:min(640px, 100%);
      position:relative;
      border-radius:32px;
      padding:1px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.03) 42%, rgba(56,189,248,.10));
      box-shadow:
        0 38px 120px rgba(0,0,0,.48),
        0 0 70px rgba(56,189,248,.024),
        0 0 60px rgba(16,185,129,.018);
      overflow:hidden;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:-80px;
      background:
        radial-gradient(circle at 20% 0%, rgba(16,185,129,.18), transparent 32%),
        radial-gradient(circle at 82% 100%, rgba(56,189,248,.16), transparent 36%);
      opacity:.72;
      filter:blur(20px);
      pointer-events:none;
    }

    .card-inner{
      position:relative;
      border-radius:31px;
      padding:42px 40px 38px;
      background:
        radial-gradient(560px 220px at 50% 0%, rgba(56,189,248,.035), transparent 72%),
        linear-gradient(180deg, rgba(13,20,29,.86), rgba(7,10,14,.91));
      backdrop-filter:blur(18px);
    }

    h1{
      margin:0;
      font-size:clamp(46px, 6.3vw, 76px);
      letter-spacing:-.055em;
      line-height:.96;
      text-align:center;
    }

    .gradient{
      background:linear-gradient(90deg,var(--brand-green),var(--brand-blue));
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    p{
      max-width:500px;
      margin:16px auto 0;
      color:rgba(255,255,255,.73);
      font-size:17px;
      line-height:1.65;
      text-align:center;
    }

    .next-step{
      margin:24px auto 0;
      max-width:500px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:20px;
      padding:14px 16px;
      background:rgba(255,255,255,.035);
      color:rgba(255,255,255,.66);
      font-size:14px;
      line-height:1.55;
      text-align:left;
    }

    .next-step strong{
      color:rgba(255,255,255,.90);
      font-weight:650;
    }

    .actions{
      display:flex;
      justify-content:center;
      gap:12px;
      margin-top:24px;
      flex-wrap:wrap;
    }

    a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:48px;
      padding:0 20px;
      border-radius:16px;
      text-decoration:none;
      font-weight:700;
      transition:transform .24s cubic-bezier(.2,.8,.2,1), border-color .22s ease, background .22s ease, opacity .22s ease;
    }

    .primary{
      color:#06100d;
      background:linear-gradient(135deg, rgba(255,255,255,.96), rgba(255,255,255,.74));
      box-shadow:
        0 14px 32px rgba(0,0,0,.24),
        0 0 0 1px rgba(255,255,255,.38) inset;
    }

    a:hover{
      transform:translateY(-1px);
    }

    .brand-mark{
      position:absolute;
      top:32px;
      left:50%;
      transform:translateX(-50%);
      display:flex;
      align-items:center;
      gap:10px;
      color:rgba(255,255,255,.86);
      font-weight:780;
      letter-spacing:-.03em;
    }

    .brand-dot{
      width:11px;
      height:11px;
      border-radius:999px;
      background:linear-gradient(135deg,var(--brand-green),var(--brand-blue));
      box-shadow:0 0 20px rgba(16,185,129,.40);
    }

    @media(max-width:640px){
      body{ overflow:auto; }
      .card-inner{ padding:38px 24px 32px; }
      .brand-mark{ top:22px; }
      .stage-line{ left:0; right:0; }
      .next-step{ text-align:center; }
    }

    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation:none!important;
        transition:none!important;
      }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="brand-mark" aria-label="Veyra">
      <span class="brand-dot"></span>
      <span>Veyra</span>
    </div>

    <div class="orb orb-a" aria-hidden="true"></div>
    <div class="orb orb-b" aria-hidden="true"></div>
    <div class="stage-line" aria-hidden="true"></div>

    <section class="card" aria-label="Mesaj trimis cu succes">
      <div class="card-inner">
        <h1>Primul pas <span class="gradient">e făcut.</span></h1>
        <p>Revenim în 48h cu un audit scurt și o direcție clară. Fără termeni tehnici. Doar ce merită îmbunătățit.</p>

        <div class="next-step">
          <strong>Următorul pas:</strong> analizăm mesajul tău, identificăm unde se pierde timp sau oportunitate și revenim cu o recomandare concretă.
        </div>

        <div class="actions">
          <a class="primary" href="/">Înapoi pe pagina principală</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
