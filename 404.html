<!doctype html><html lang="ro"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina nu a fost găsită</title>
<style>body{background:#0a0f18;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;display:grid;place-items:center;height:100vh;margin:0}.card{max-width:560px;padding:28px;border-radius:16px;background:#111827;border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.3)}a{color:#38BDF8;text-decoration:none}a:hover{text-decoration:underline}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.05;
  background-image:
    linear-gradient(rgba(255,255,255,.16) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.16) 1px, transparent 1px);
  background-size:38px 38px;
  mask-image:radial-gradient(circle at 50% 35%, black, transparent 76%);
}
a{
  box-shadow:0 0 0 1px rgba(255,255,255,.14) inset, 0 18px 46px rgba(0,0,0,.30);
}
a:hover{ transform:translateY(-1px); }

/* Subtle Veyra atmosphere for 404 */
body{
  background:
    radial-gradient(680px 280px at 14% 10%, rgba(16,185,129,.10), transparent 64%),
    radial-gradient(740px 320px at 86% 72%, rgba(56,189,248,.095), transparent 68%),
    linear-gradient(180deg,#050505 0%,#070707 52%,#050505 100%) !important;
}

</style>
</head><body>
  <div class="card">
    <h1 style="margin:0 0 8px">404 — Pagina nu există</h1>
    <p>Link-ul accesat nu există sau a expirat.</p>
    <p><a href="/">Înapoi la pagina principală</a></p>
  </div>
</body></html>
